- name: 镜头
  groups:
    - name: 镜头类型
      color: rgba(99, 201, 2, .4)
      tags:
        cropped legs: 七分腿
# --- [远景与环境控制 - Environment Focused] ---
        panorama: 全景 (超宽视野)
        extreme_wide_shot: 超广角全景 (环境主导，角色很小)
        wide_shot: 广角镜头 (全景镜头)
        landscape: 风景镜头 (侧重横向环境)
        scenery: 强调背景风景
        
        # --- [角色构图比例 - Character Framing] ---
        full_body:1.2: 全身像 (从头到脚)
        full_shot:1.2: 全身镜头 (包含完整角色与部分环境)
        cowboy_shot: 牛仔镜头 (上半身到大腿中部，动漫最稳构图)
        medium_shot: 中景镜头 (腰部以上)
        mid_shot: 中景镜头 (与 medium_shot 通用)
        upper_body: 上半身
        lower_body: 下半身 (强调腿部/下体)
        bust: 半身像 (胸部以上)
        portrait: 肖像 (脸/肩/胸，头像常用)
        close-up: 特写 (脸部细节)
        face_focus: 脸部焦点
        
        # --- [视角与方位 - Angle & Orientation] ---
        front_view: 正视图
        side_view: 侧视图
        profile: 侧面肖像 (portrait 的侧脸版)
        three-quarter_view: 三分之二侧面 (最显身材/脸型的角度)
        back_view: 背面视角 (from_behind)
        from_above: 俯视视角 (high_angle)
        from_below: 仰视视角 (low_angle / 压迫感)
        bird's-eye_view: 鸟瞰视角 (垂直向下)
        worm's-eye_view: 虫瞻视角 (极致仰视)
        
        # --- [特殊分镜与边框 - Framing Effects] ---
        split_screen: 分镜 (多格漫画感)
        multiple_views: 多视角 (同屏展示不同角度)
        white_border: 白框 (增加插画感)
        letterboxing: 电影黑边 (上下黑条)
        viewfinder: 取景器视角
        
        # --- [推荐组合：Illustrious 实战脚本] ---
        wide_shot, landscape, cityscape: 广阔城市全景 (环境压倒角色，适合大片感)
        cowboy_shot, full_body, three-quarter_view: 经典动漫构图 (身材比例最协调)
        bust, portrait, close-up, face_focus: 精致肖像特写 (脸部细节拉满)
        full_shot, from_behind, back_view: 完整背面全身 (翘臀/背影视角)
        lower_body, close-up, from_below: 下半身特写/仰视 (绝对领域/长腿控必备)

    - name: 特写 & 焦点镜头
      color: rgba(99, 201, 2, .4)
      tags:
        # --- [镜头缩放 - Camera Zoom] ---
        close-up: 特写镜头 (强调局部)
        extreme_close-up: 极特写 (眼睛/嘴唇/手指放大)
        macro_shot: 微距镜头 (极细微的纹理，如皮肤毛孔、水滴)
        
        # --- [焦点控制 - Focus Tags] ---
        solo_focus: 聚焦单人 (多角色场景中锁定主角)
        face_focus: 聚焦面部 (神情神态)
        eyes_focus: 聚焦眼睛 (眼神交流)
        breast_focus: 聚焦胸部 (between_breasts 突出胸间)
        hip_focus: 聚焦臀部 (ass_focus 屁股焦点)
        crotch_focus: 聚焦裆部 (between_legs 强调两腿之间)
        foot_focus: 聚焦脚部 (soles_focus 脚底焦点)
        hand_focus: 聚焦手部 (between_fingers 突出指间)
        vehicle_focus: 聚焦载具
        
        # --- [窥视与走光视角 - Peeking & Voyeurism] ---
        peeking: 偷窥 (从缝隙、遮挡物后看)
        peeping: 窥视 (更强调“窥淫”视角)
        peeking_out: 探头偷窥 (动作姿态)
        midriff_peek: 露肚脐 (上衣过短露出)
        armpit_peek: 腋窝特写 (侧面视角常见)
        panty_peek: 内裤走光 (从裙底或缝隙漏出)
        pantyshot: 内裤镜头 (正面展示)
        pussy_peek: 私处特写 (通常配合下体聚焦)
        caught: 被抓现行 (惊讶/羞涩的神情配合)
        
        # --- [特殊表现手法 - Special Rendering] ---
        cross-section: 剖面图 (经典的本子内视图)
        x-ray: X射线 (透视效果)
        inset: 镜头内嵌 (大图角落插入小图特写)
        
        # --- [推荐组合：Illustrious 实战焦点] ---
        close-up, face_focus, eyes_focus, looking_at_viewer: 极高互动感 (眼神直刺人心)
        macro_shot, foot_focus, soles_focus, wrinkled_soles: 足控极致 (刻画脚底褶皱纹理)
        close-up, ass_focus, between_legs, crotch_focus: 下体核心焦点 (高张力构图)
        panty_peek, peeking, caught, low_angle: 经典偷窥视角 (叙事性极强)
        extreme_close-up, tongue_out, drooling, saliva_focus: 舌尖/唾液特写 (极度色气)

    - name: 其他构图
      color: rgba(99, 201, 2, .4)
      tags:
# --- [高低视角控制 - Vertical Angles] ---
        high_angle: 高角度俯拍 (表现角色可爱/弱势)
        from_above: 从上方俯视 (常用俯角)
        bird's_eye_view: 鸟瞰视角 (极高垂直俯视)
        eye_level: 平视视角 (自然、写实、中性)
        low_angle: 低角度仰拍 (表现角色强势/威严)
        from_below: 从下方仰视 (常用仰角)
        worm's_eye_view: 蛙眼视角 (极低位置向上看)
        upskirt: 裙底视角 (经典仰视变体)
        
        # --- [方位与动态视角 - Directional Views] ---
        frontal_view: 正面视角
        three-quarter_view: 3/4侧面视角 (最显身材的角度)
        side_view: 侧视图
        back_view: 背面视角 (from_behind)
        turn_one's_back: 转身姿态
        looking_back_over_shoulder: 回头看 (扭身回头，极具诱惑力)
        looking_at_viewer: 直视观众 (增加互动感/眼神对视)
        
        # --- [镜头特殊效果 - Lens & Cinematic] ---
        dutch_angle: 荷兰角 (镜头倾斜，营造不安或艺术感)
        fisheye_lens: 鱼眼镜头 (边缘强烈扭曲，空间感极强)
        foreshortening: 透视夸张 (近大远小，常用于强调伸出的手或腿)
        aerial: 空中视角 (带点漂浮感)
        panoramic: 全景/宽幅
        multiple_views: 多视角分解 (同屏展示不同角度)
