<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Toast 视觉验证</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; background: #f0ece8; }
    #app { font-family: 'HarmonyOS Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 40px; }
    #app button {
      margin: 4px; padding: 8px 16px; font-size: 13px; cursor: pointer;
      background: #fff; border: 1px solid #d5d0ca; border-radius: 8px; color: #333;
    }
    #app button:hover { border-color: #e07b6c; color: #e07b6c; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/toast-test-main.js"></script>

</html>
