<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town life fixture</title><div id="app"></div><script type="module">
import { createApp, ref, h } from 'vue'
import TownLifePanel from '../src/components/town/TownLifePanel.vue'
import LinsheButton from '../src/components/ui/LinsheButton.vue'
const open = ref(true)
window.fixture = { open, keys: 0, moves: [], closes: 0 }
window.addEventListener('keydown', () => fixture.keys++)
createApp({ setup: () => () => h('main', [
  h('p', '小镇生活 · 独立界面验证'),
  h(LinsheButton, { onClick: () => { open.value = true } }, () => '打开生活面板'),
  h(TownLifePanel, { open: open.value, onClose: () => { open.value = false; fixture.closes++ }, onMoveTo: key => fixture.moves.push(key) }),
]) }).mount('#app')
</script><style>:root{--accent:#e07b6c;--accent-hover:#cc6a5c;--accent-light:#f0a89a;--danger:#e25c5c;--text-secondary:#8c8074;--text-bright:#111;--border:#e0dcd6}body{margin:0;font-family:system-ui,sans-serif;background:#e8e4dc;color:#74665a}main{padding:24px;min-height:100vh;box-sizing:border-box}</style></html>
