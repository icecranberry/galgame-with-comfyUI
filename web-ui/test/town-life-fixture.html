<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town life fixture</title><div id="app"></div><script type="module">
import { createApp, ref, h } from 'vue'
import TownWalletPanel from '../src/components/town/TownWalletPanel.vue'
import TownBoardPanel from '../src/components/town/TownBoardPanel.vue'
import LinsheButton from '../src/components/ui/LinsheButton.vue'
const wallet = ref(false), board = ref(false)
window.fixture = { open: wallet, board, keys: 0, moves: [], closes: 0, appointments: 0 }
window.addEventListener('keydown', () => fixture.keys++)
createApp({ setup: () => () => h('main', [
  h('p', '小镇生活 · 独立界面验证'),
  h(LinsheButton, { onClick: () => { wallet.value = true; board.value = false } }, () => '打开钱袋面板'),
  h(LinsheButton, { onClick: () => { wallet.value = false; board.value = true } }, () => '打开公告站面板'),
  h(TownWalletPanel, { open: wallet.value, onClose: () => { wallet.value = false; fixture.closes++ } }),
  h(TownBoardPanel, { open: board.value, onClose: () => { board.value = false; fixture.closes++ }, onMoveTo: key => fixture.moves.push(key), onAppointments: () => { fixture.appointments++ } }),
]) }).mount('#app')
</script><style>:root{--accent:#e07b6c;--accent-hover:#cc6a5c;--accent-light:#f0a89a;--danger:#e25c5c;--text-secondary:#8c8074;--text-bright:#111;--border:#e0dcd6}body{margin:0;font-family:system-ui,sans-serif;background:#e8e4dc;color:#74665a}main{padding:24px;min-height:100vh;box-sizing:border-box}</style></html>
