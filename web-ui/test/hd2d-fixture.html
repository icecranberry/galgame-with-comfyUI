<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>M1 isolated render fixture</title>
<style>html,body,#app{margin:0;width:100%;height:100%;font-family:system-ui;background:#f4f1ee}*{box-sizing:border-box}</style>
<div id="app"></div>
<script type="module">
import '/src/App.vue?vue&type=style&index=0&lang.css'
import { createApp } from 'vue'
import { createPinia } from 'pinia'
import { createRouter, createMemoryHistory } from 'vue-router'
import TownView from '/src/views/TownView.vue'
import { useTownStore } from '/src/stores/town.js'
import { Hd2dTownRenderer } from '/src/town/renderers/Hd2dTownRenderer.js'
import { adaptAgent } from '/src/town/renderers/TownSceneAdapter.js'
const assets = [
  { id: 1, kind: 'ground', imagePath: '/fixture-assets/asset_216_grass_01_01.png', meta: {} },
  { id: 2, kind: 'road', imagePath: '/fixture-assets/asset_218_plaza_tile.png', meta: {} },
  { id: 3, kind: 'building', imagePath: '/fixture-assets/asset_225_residential.png', meta: { footprint: { w: 3, h: 2 } } },
]
const map = { version: 1, cols: 16, rows: 16, name: 'M1 验收小镇', assets, locations: [], layers: {
  ground: Array.from({ length: 16 }, () => Array(16).fill(1)),
  road: Array.from({ length: 16 }, (_, y) => Array(16).fill(y >= 8 && y <= 10 ? 2 : null)),
  objects: [{ id: 'a', assetId: 3, x: 4, y: 6 }, { id: 'b', assetId: 3, x: 10, y: 6 }], blockOverride: [],
} }
const agents = [
  { agentKey: 'npc:34', npcId: 34, kind: 'npc', displayName: '邻居', x: 7, y: 9, sprites: { down: '/fixture-assets/asset_286_npc_34_down.png', up: '/fixture-assets/asset_288_npc_34_up.png' } },
]
const player = { ...agents[0], agentKey: 'me', displayName: '我', x: 8, y: 9 }
const weather = { hour: 12, text: '晴', timeDesc: '午后' }
const street = new URLSearchParams(location.search).has('street')
if (street) {
  assets.push(
    { id: 4, key: 'tree_01', kind: 'prop', imagePath: '/fixture-assets/asset_234_tree_01.png', meta: { footprint: { w: 2, h: 2 } } },
    { id: 5, key: 'streetlamp', kind: 'prop', imagePath: '/fixture-assets/asset_236_streetlamp.png', meta: {} },
    { id: 7, key: 'flower_bush', kind: 'prop', imagePath: '/fixture-assets/asset_237_flower_bush.png', meta: { footprint: { w: 1, h: 1 } } },
    { id: 6, key: 'bench', kind: 'prop', imagePath: '/fixture-assets/asset_235_bench_01.png', meta: {} },
  )
  map.cols = map.rows = 24
  map.layers.ground = Array.from({ length: 24 }, () => Array(24).fill(1))
  map.layers.road = Array.from({ length: 24 }, (_,y) => Array.from({ length: 24 },(_,x) => (y >= 9 && y <= 12) || (x >= 9 && x <= 12) ? 2 : null))
  map.layers.objects = []
  for (const [x,y] of [[4,7],[9,6],[14,7],[17,10],[4,15],[14,16],[3,21],[17,22]]) map.layers.objects.push({ id: `house:${x}:${y}`, assetId: 3, x,y })
  for (const [x,y] of [[2,4],[6,3],[15,3],[19,6],[7,8],[15,12],[8,17],[1,13],[21,15],[18,19],[11,20]]) map.layers.objects.push({ id: `tree:${x}:${y}`, assetId: 4,x,y })
  for (const [x,y] of [[8,10],[13,10],[8,13],[13,13],[8,7],[13,7]]) map.layers.objects.push({ id: `lamp:${x}:${y}`, assetId: 5,x,y })
  map.layers.objects.push({ id: 'bench',assetId: 6,x:8,y:12 })
  map.layers.objects.push({ id: 'flower:a', assetId: 7, x: 10, y: 14 }, { id: 'flower:b', assetId: 7, x: 13, y: 16, flip: true })
  player.x = 11; player.y = 12; agents[0].x = 10; agents[0].y = 12
}
const probe = window.probe = { map, agents, player, weather, moves: [], starts: 0, stops: 0 }
if (new URLSearchParams(location.search).has('page')) {
  const pinia = createPinia(), router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/', component: TownView }] })
  const town = useTownStore(pinia)
  const state = { map, initialized: true, agents, player, weather, locations: [], encountersActive: [] }
  town.snapshot = state; town.mapData = map; town.loaded = true; town.connected = true
  town.startTownStream = () => { probe.starts++ }
  town.stopTownStream = () => { probe.stops++ }
  town.fetchState = async () => state
  town.fetchMap = async () => map
  town.movePlayer = async (x, y) => { probe.moves.push({ x, y }) }
  town.movePlayerDir = async (dx, dy) => { probe.moves.push({ dx, dy }) }
  probe.town = town
  probe.mount = () => { probe.app = createApp(TownView).use(pinia).use(router); probe.app.mount('#app') }
  probe.mount()
} else {
  const renderer = new Hd2dTownRenderer({ onFailure: message => { probe.failure = message } })
  probe.renderer = renderer
  renderer.mount(document.querySelector('#app'))
  renderer.resize(innerWidth, innerHeight, devicePixelRatio)
  renderer.setScene(map); renderer.setCamera(street ? { x: -32, y: 336, zoom: 1.65 } : { x: 0, y: 256, zoom: 1.4 })
  probe.draw = () => {
    renderer.updateAgents([...agents, player].map(a => adaptAgent(a, { x: a.x, y: a.y, moving: probe.moving || false }, 'down', probe.nowMs || 0)))
    renderer.render(weather)
  }
  const frame = () => { if (renderer.disposed) return; probe.draw(); requestAnimationFrame(frame) }
  frame()
}
</script></html>
