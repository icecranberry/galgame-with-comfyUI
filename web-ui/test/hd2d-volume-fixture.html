<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>M7 isolated modular volume prototype</title>
<style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1ee;font-family:system-ui}aside{position:absolute;left:20px;top:18px;padding:12px 16px;border-radius:12px;background:#f4f1eeed;color:#594d43;pointer-events:none}h1{font-size:20px;margin:0 0 6px}p{font-size:13px;margin:0}</style>
<div id="scene"></div><aside><h1 id="label">M7 · 模块化体积原型</h1><p>隔离 fixture · 默认色盘 / 可选分面纹理 · 非最终素材</p></aside>
<script type="module">
import { BUILDING_PROFILES } from '/src/town/renderers/buildingVolumeProfile.js'
const query = new URLSearchParams(location.search)
const rendererModule = query.has('baseline') ? '/src/town/renderers/Hd2dTownRenderer.baseline.js' : '/src/town/renderers/Hd2dTownRenderer.js'
const { Hd2dTownRenderer } = await import(/* @vite-ignore */ rendererModule)
const svg = body => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96">${body}</svg>`)}`
const profile = query.get('profile') || 'cafe'
const legacy = query.has('legacy')
const asset = { id: 1, kind: 'building', imagePath: '/fixture-card.svg', meta: { footprint: { w: 3, h: 3 }, doorOffset: { dx: 1, dy: 2 }, ...(legacy ? {} : { projection: 'modular_volume', modularVolumeVersion: 1, buildingProfile: profile }) } }
const map = { cols: 14, rows: 14, assets: [asset], layers: { ground: [], road: [], objects: [{ id:'building',assetId:1,x:4,y:7 }] } }
const r = new Hd2dTownRenderer(); r.mount(document.querySelector('#scene'))
r.resize(innerWidth,innerHeight,1); r.setQuality('balanced',false)
r.setCamera({x:-32,y:164,zoom:2.3}); r.setScene(map)
const probe = window.probe = { renderer:r,map,asset,weather:{hour:12,text:'晴'},draw:()=>r.render(probe.weather),
  setProfile(value) { asset.meta.buildingProfile=value; document.querySelector('#label').textContent=`M7 · ${BUILDING_PROFILES[value].label}体积原型`; r.setScene(map); probe.draw() },
  setTextures(value) { asset.meta.buildingTextures=value; r.setScene(map); probe.draw() },
  svg,
}
document.querySelector('#label').textContent = legacy ? 'M7 · 旧贴片回归 fixture' : `M7 · ${BUILDING_PROFILES[profile].label}体积原型`
probe.draw()
function frame(){if(!r.disposed){probe.draw();requestAnimationFrame(frame)}}requestAnimationFrame(frame)
</script></html>
