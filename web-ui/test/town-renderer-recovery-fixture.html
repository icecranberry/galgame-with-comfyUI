<!doctype html><html><meta charset="utf-8"><div id="app"></div><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;--accent:#c66c5c;--text-secondary:#8c8074}#app{position:relative}</style><script type="module">
import {createApp} from 'vue'
import {createPinia} from 'pinia'
import TownView from '../src/views/TownView.vue'
import {Hd2dTownRenderer} from '../src/town/renderers/Hd2dTownRenderer.js'
import {useTownStore} from '../src/stores/town.js'
const renderers=[], original=Hd2dTownRenderer.prototype.mount
Hd2dTownRenderer.prototype.mount=function(...args){renderers.push(this);return original.apply(this,args)}
localStorage.setItem('town.renderer',new URLSearchParams(location.search).get('mode') || 'balanced')
const pinia=createPinia(), app=createApp(TownView).use(pinia)
window.fixture={renderers,town:useTownStore(pinia),unmount:()=>app.unmount()}
app.mount('#app')
</script></html>
